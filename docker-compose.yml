services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scif
      POSTGRES_USER: scif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - scif-data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scif -d scif"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      private:
        aliases: [database]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://scif:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/scif
      SCIF_JWT_SECRET: ${SCIF_JWT_SECRET:?Set SCIF_JWT_SECRET in .env}
      APP_ORIGINS: ${APP_ORIGINS:?Set APP_ORIGINS in .env}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-18080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      private:
        aliases: [api]

volumes:
  scif-data:

networks:
  private:
    # Keep this as a regular bridge: Docker Desktop cannot publish host ports from an internal-only network.
    # PostgreSQL remains unexposed; only the API is bound to 127.0.0.1.
