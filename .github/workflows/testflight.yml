name: Build SCIF Mobile for TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/testflight.yml'

permissions:
  contents: read

jobs:
  ios-testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then echo 'Missing repository Actions variable VITE_API_BASE_URL (public HTTPS API URL).'; exit 1; fi
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo 'VITE_API_BASE_URL must use public HTTPS.'; exit 1 ;; esac
          case "$VITE_API_BASE_URL" in *example.com*|*example.invalid*) echo 'Replace the example API URL with your deployed SCIF API before building.'; exit 1 ;; esac
          npm run build

      - name: Add iOS project and sync Capacitor
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install iOS CocoaPods dependencies
        run: pod install --project-directory=ios/App

      - name: Install App Store Connect signing key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_PRIVATE_KEY_BASE64" || { echo 'Missing ASC_PRIVATE_KEY_BASE64'; exit 1; }
          test -n "$ASC_KEY_ID" || { echo 'Missing ASC_KEY_ID'; exit 1; }
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$key_path")"
          if [[ "$ASC_PRIVATE_KEY_BASE64" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$ASC_PRIVATE_KEY_BASE64" > "$key_path"
          else
            printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
            rm -f "$key_path"
            echo 'ASC_PRIVATE_KEY_BASE64 is neither a valid base64-encoded PEM nor a valid PEM key. Set it to the exact App Store Connect AuthKey .p8 file contents, either raw PEM or base64-encoded once.'
            exit 1
          fi
          echo 'App Store Connect private key format verified.'

      # Which App Store Connect record this build belongs to. Capacitor stamps
      # appId from capacitor.config.ts into the generated project, which is the
      # other SCIF record ("SCIF Mobile", com.scif.privatecomms), so the identity
      # is stated here and handed to xcodebuild instead: the archive and
      # everything exported from it are us.innotel.scif ("SCIF Privacy") unless
      # the IOS_BUNDLE_ID repository variable says otherwise. The fallback is
      # what makes that true even while no variable exists, so the two records
      # cannot be swapped by forgetting to configure one.
      - name: Archive signed iOS app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'us.innotel.scif' }}
        run: |
          test -n "$ASC_ISSUER_ID" || { echo 'Missing ASC_ISSUER_ID'; exit 1; }
          test -n "$IOS_TEAM_ID" || { echo 'Missing IOS_TEAM_ID'; exit 1; }
          case "$IOS_BUNDLE_ID" in
            *example*|*invalid*) echo "IOS_BUNDLE_ID is a placeholder, not a bundle id: $IOS_BUNDLE_ID"; exit 1 ;;
            *.*.*) ;;
            *) echo "IOS_BUNDLE_ID must be a reverse-DNS bundle id such as us.innotel.scif, got: $IOS_BUNDLE_ID"; exit 1 ;;
          esac
          echo "Archiving for $IOS_BUNDLE_ID (team $IOS_TEAM_ID)."
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SCIF.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
          # Read the identity back out of the archive: the build setting above
          # decides where this ends up, and an archive that disagrees would
          # upload to the wrong app record without failing anything else.
          archived=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/SCIF.xcarchive/Info.plist")
          if [ "$archived" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::archive is $archived, expected $IOS_BUNDLE_ID"
            exit 1
          fi
          echo "Archive carries $archived."

      - name: Export App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'us.innotel.scif' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SCIF.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"
          # -exportArchive re-signs the archive it is handed and takes no bundle
          # id of its own, so the identity is only correct if it came through —
          # which is worth checking before altool spends the upload.
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$RUNNER_TEMP/ipa"
          exported=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/ipa/Payload/App.app/Info.plist")
          if [ "$exported" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::exported app is $exported, expected $IOS_BUNDLE_ID"
            exit 1
          fi
          echo "Exported IPA carries $exported."

      - name: Upload build to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Retain IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scif-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/App.ipa
          if-no-files-found: ignore
          retention-days: 7
