name: Build SCIF Mobile for TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/testflight.yml'

permissions:
  contents: read

jobs:
  ios-testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS project and sync Capacitor
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install iOS CocoaPods dependencies
        run: pod install --project-directory=ios/App

      - name: Install App Store Connect signing key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_PRIVATE_KEY_BASE64" || { echo 'Missing ASC_PRIVATE_KEY_BASE64'; exit 1; }
          test -n "$ASC_KEY_ID" || { echo 'Missing ASC_KEY_ID'; exit 1; }
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$key_path")"
          if [[ "$ASC_PRIVATE_KEY_BASE64" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$ASC_PRIVATE_KEY_BASE64" > "$key_path"
          else
            printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
            rm -f "$key_path"
            echo 'ASC_PRIVATE_KEY_BASE64 is neither a valid base64-encoded PEM nor a valid PEM key. Set it to the exact App Store Connect AuthKey .p8 file contents, either raw PEM or base64-encoded once.'
            exit 1
          fi
          echo 'App Store Connect private key format verified.'

      - name: Archive signed iOS app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          test -n "$ASC_ISSUER_ID" || { echo 'Missing ASC_ISSUER_ID'; exit 1; }
          test -n "$IOS_TEAM_ID" || { echo 'Missing IOS_TEAM_ID'; exit 1; }
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SCIF.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SCIF.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/App.ipa"

      - name: Upload build to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Retain IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scif-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/App.ipa
          if-no-files-found: ignore
          retention-days: 7
